<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <style>
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes sp { 0%,100%{opacity:0;transform:scale(0.5)} 50%{opacity:1;transform:scale(1)} }
    .fg { animation: float 2.3s ease-in-out infinite; transform-origin: 100px 100px; }
    .s0 { animation: sp 2.1s ease-in-out 0.0s infinite; transform-origin: 162px 28px; }
    .s1 { animation: sp 2.1s ease-in-out 0.7s infinite; transform-origin: 34px 148px; }
  </style>

  <!-- blob -->
  <ellipse cx="100" cy="108" rx="88" ry="76" fill="#FFE0E0"/>

  <!-- sparkles -->
  <g class="s0"><path d="M162 22l2.5 9 9 2.5-9 2.5-2.5 9-2.5-9-9-2.5 9-2.5z" fill="#F4C842"/></g>
  <g class="s1"><path d="M34 142l2 7 7 2-7 2-2 7-2-7-7-2 7-2z" fill="#7EC8F7"/></g>
  <text x="34"  y="52"  font-size="14" font-family="sans-serif" fill="#F87272" opacity=".75">×</text>
  <text x="160" y="172" font-size="14" font-family="sans-serif" fill="#F87272" opacity=".75">×</text>
  <text x="158" y="64"  font-size="14" font-family="sans-serif" fill="#7EC8F7" opacity=".7">+</text>
  <text x="36"  y="172" font-size="14" font-family="sans-serif" fill="#F4C842" opacity=".8">+</text>

  <!-- floating card -->
  <g class="fg">
    <ellipse cx="101" cy="185" rx="38" ry="6" fill="#E87070" opacity=".22"/>
    <rect x="58" y="24" width="84" height="108" rx="9" fill="white" stroke="#CC2929" stroke-width="6"/>
    <polygon points="112,24 142,54 112,54" fill="#FFB3B3" stroke="#CC2929" stroke-width="5" stroke-linejoin="round"/>
    <text x="100" y="94" text-anchor="middle" font-size="28" font-family="sans-serif" fill="#CC2929" font-weight="700">PDF</text>
    <line x1="68" y1="104" x2="130" y2="104" stroke="#FFB3B3" stroke-width="4" stroke-linecap="round"/>
    <line x1="68" y1="116" x2="112" y2="116" stroke="#FFB3B3" stroke-width="4" stroke-linecap="round"/>
    <rect x="60" y="108" width="44" height="14" rx="5" fill="#CC2929"/>
    <text x="82" y="119" text-anchor="middle" font-size="9" font-family="sans-serif" fill="white" font-weight="700">Adobe PDF</text>
  </g>
</svg>
