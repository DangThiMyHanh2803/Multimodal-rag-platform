<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <style>
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes sp { 0%,100%{opacity:0;transform:scale(0.5)} 50%{opacity:1;transform:scale(1)} }
    .fg { animation: float 2.3s ease-in-out 0.3s infinite; transform-origin: 100px 100px; }
    .s0 { animation: sp 2.1s ease-in-out 0.0s infinite; transform-origin: 162px 28px; }
    .s1 { animation: sp 2.1s ease-in-out 0.7s infinite; transform-origin: 34px 148px; }
  </style>

  <!-- blob -->
  <ellipse cx="100" cy="108" rx="88" ry="76" fill="#DFF0FF"/>

  <!-- sparkles -->
  <g class="s0"><path d="M162 22l2.5 9 9 2.5-9 2.5-2.5 9-2.5-9-9-2.5 9-2.5z" fill="#F4C842"/></g>
  <g class="s1"><path d="M34 142l2 7 7 2-7 2-2 7-2-7-7-2 7-2z" fill="#F87272"/></g>
  <text x="34"  y="52"  font-size="14" font-family="sans-serif" fill="#4A9FD9" opacity=".7">×</text>
  <text x="160" y="172" font-size="14" font-family="sans-serif" fill="#4A9FD9" opacity=".7">×</text>
  <text x="158" y="64"  font-size="14" font-family="sans-serif" fill="#F4C842" opacity=".8">+</text>
  <text x="36"  y="172" font-size="14" font-family="sans-serif" fill="#F87272" opacity=".7">+</text>

  <!-- floating card -->
  <g class="fg">
    <ellipse cx="101" cy="185" rx="38" ry="6" fill="#4A9FD9" opacity=".22"/>
    <rect x="58" y="24" width="84" height="108" rx="9" fill="white" stroke="#1A6FB5" stroke-width="6"/>
    <polygon points="112,24 142,54 112,54" fill="#A8D8F5" stroke="#1A6FB5" stroke-width="5" stroke-linejoin="round"/>
    <text x="100" y="90" text-anchor="middle" font-size="36" font-family="sans-serif" fill="#1A6FB5" font-weight="700">W</text>
    <line x1="68" y1="100" x2="130" y2="100" stroke="#7EC8F7" stroke-width="4" stroke-linecap="round"/>
    <line x1="68" y1="112" x2="130" y2="112" stroke="#7EC8F7" stroke-width="4" stroke-linecap="round"/>
    <line x1="68" y1="124" x2="105" y2="124" stroke="#7EC8F7" stroke-width="4" stroke-linecap="round"/>
    <rect x="60" y="108" width="48" height="14" rx="5" fill="#1A6FB5"/>
    <text x="84" y="119" text-anchor="middle" font-size="9" font-family="sans-serif" fill="white" font-weight="700">Word</text>
  </g>
</svg>
